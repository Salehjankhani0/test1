name: 1 - Create signing key (one time only)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -keystore keystore.jks -storetype PKCS12 \
            -alias glasscut -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Glass Cut, O=Glass Cut, C=IR"
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
            echo "KEY_ALIAS=glasscut"
            echo "KEYSTORE_BASE64=$(base64 -w0 keystore.jks)"
          } > keystore-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-BACKUP-KEEP-SAFE
          path: |
            keystore.jks
            keystore-info.txt
          retention-days: 1
