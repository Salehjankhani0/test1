name: 2 - Build signed release APK (for Bazaar / Myket)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Build web app
        run: npm run build

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Harden Android release
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=android/app/src/main
          PKG_DIR="$APP_DIR/java/com/glasscut/app"
          mkdir -p "$PKG_DIR" "$APP_DIR/res/xml"

          cat > "$PKG_DIR/MainActivity.java" <<'EOF'
package com.glasscut.app;

import android.os.Bundle;
import android.view.WindowManager;
import android.webkit.WebSettings;
import android.webkit.WebView;

import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
    @Override
    public void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE);
        WebView webView = getBridge().getWebView();
        if (webView != null) {
            WebSettings settings = webView.getSettings();
            settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
            settings.setAllowContentAccess(false);
            WebView.setWebContentsDebuggingEnabled(BuildConfig.DEBUG);
        }
    }
}
EOF

          cat > "$APP_DIR/res/xml/network_security_config.xml" <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
    <base-config cleartextTrafficPermitted="false" />
</network-security-config>
EOF

          cat > "$APP_DIR/res/xml/backup_rules.xml" <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<full-backup-content>
    <exclude domain="root" path="." />
</full-backup-content>
EOF

          cat > "$APP_DIR/res/xml/data_extraction_rules.xml" <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<data-extraction-rules>
    <cloud-backup disableIfNoEncryptionCapabilities="true">
        <exclude domain="root" path="." />
    </cloud-backup>
    <device-transfer>
        <exclude domain="root" path="." />
    </device-transfer>
</data-extraction-rules>
EOF

          python3 - <<'PY2'
from pathlib import Path
p=Path('android/app/src/main/AndroidManifest.xml')
s=p.read_text()
s=s.replace('<application', '<application android:allowBackup="false" android:usesCleartextTraffic="false" android:networkSecurityConfig="@xml/network_security_config" android:fullBackupContent="@xml/backup_rules" android:dataExtractionRules="@xml/data_extraction_rules"', 1)
p.write_text(s)
pg=Path('android/app/build.gradle')
s=pg.read_text()
s=s.replace('minifyEnabled false', 'minifyEnabled true')
s=s.replace('minifyEnabled true
', 'minifyEnabled true
            shrinkResources true
', 1)
pg.write_text(s)
PY2

      - name: Icon and version
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp public/icons/icon-192.png android/app/src/main/res/mipmap-$d/$f.png
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          VNAME=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VNAME\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Align and sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" \
            --out glass-cut-release.apk aligned.apk
          "$BT/apksigner" verify --print-certs glass-cut-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: glass-cut-release-apk
          path: glass-cut-release.apk
