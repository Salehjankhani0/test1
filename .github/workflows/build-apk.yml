name: 2 - Build signed release APK (for Bazaar / Myket)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor 6
        run: npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: TypeScript and Vite build
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Harden Android project
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="android/app/src/main"
          PKG_DIR="$APP_DIR/java/com/glasscut/app"
          RES_DIR="$APP_DIR/res"

          mkdir -p "$PKG_DIR" "$RES_DIR/xml"

          cat > "$PKG_DIR/MainActivity.java" <<'EOF'
          package com.glasscut.app;

          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE);

                  WebView webView = getBridge().getWebView();
                  if (webView != null) {
                      WebSettings settings = webView.getSettings();
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                      settings.setAllowContentAccess(false);
                      WebView.setWebContentsDebuggingEnabled(BuildConfig.DEBUG);
                  }
              }
          }
          EOF

          cat > "$RES_DIR/xml/network_security_config.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false" />
          </network-security-config>
          EOF

          cat > "$RES_DIR/xml/backup_rules.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
              <exclude domain="root" path="." />
          </full-backup-content>
          EOF

          cat > "$RES_DIR/xml/data_extraction_rules.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup disableIfNoEncryptionCapabilities="true">
                  <exclude domain="root" path="." />
              </cloud-backup>
              <device-transfer>
                  <exclude domain="root" path="." />
              </device-transfer>
          </data-extraction-rules>
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text(encoding="utf-8")

          attrs = {
              "android:allowBackup": 'android:allowBackup="false"',
              "android:usesCleartextTraffic": 'android:usesCleartextTraffic="false"',
              "android:networkSecurityConfig": 'android:networkSecurityConfig="@xml/network_security_config"',
              "android:fullBackupContent": 'android:fullBackupContent="@xml/backup_rules"',
              "android:dataExtractionRules": 'android:dataExtractionRules="@xml/data_extraction_rules"',
          }

          for key in attrs:
              s = re.sub(r'\s+' + re.escape(key) + r'="[^"]*"', '', s)

          replacement = (
              '<application '
              + ' '.join(attrs.values())
          )

          s = s.replace('<application', replacement, 1)
          manifest.write_text(s, encoding="utf-8")

          gradle = Path("android/app/build.gradle")
          g = gradle.read_text(encoding="utf-8")

          # Enable R8/resource shrinking only in the release build.
          if "minifyEnabled false" in g:
              g = g.replace("minifyEnabled false", "minifyEnabled true", 1)

          if "shrinkResources" not in g:
              g = g.replace(
                  "minifyEnabled true",
                  "minifyEnabled true\n            shrinkResources true",
                  1,
              )

          gradle.write_text(g, encoding="utf-8")
          PY

      - name: Set version and Android launcher icons
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="$(node -p "require('./package.json').version")"
          VERSION_CODE="${{ github.run_number }}"

          export VERSION_NAME VERSION_CODE
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          version_name = os.environ["VERSION_NAME"]
          version_code = os.environ["VERSION_CODE"]

          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          s, n1 = re.subn(
              r'versionCode\s+\d+',
              f'versionCode {version_code}',
              s,
              count=1,
          )
          s, n2 = re.subn(
              r'versionName\s+"[^"]*"',
              f'versionName "{version_name}"',
              s,
              count=1,
          )

          if n1 == 0 or n2 == 0:
              raise SystemExit("Could not find versionCode/versionName in android/app/build.gradle")

          p.write_text(s, encoding="utf-8")
          PY

          ICON="public/icons/icon-192.png"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            DIR="android/app/src/main/res/mipmap-$d"
            mkdir -p "$DIR"
            cp "$ICON" "$DIR/ic_launcher.png"
            cp "$ICON" "$DIR/ic_launcher_round.png"
          done

          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          grep -nE 'versionCode|versionName|minifyEnabled|shrinkResources' android/app/build.gradle

      - name: Check signing secrets
        shell: bash
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$KS_B64" || { echo "Missing KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KS_PASS" || { echo "Missing KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_PASS" || { echo "Missing KEY_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS secret"; exit 1; }

      - name: Build unsigned release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon

      - name: Align and sign release APK
        shell: bash
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          INPUT_APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"

          test -f "$INPUT_APK" || { echo "Release APK was not created"; exit 1; }

          "$BUILD_TOOLS/zipalign" -p -f 4 "$INPUT_APK" "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-pass "env:KS_PASS" \
            --key-pass "env:KEY_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$RUNNER_TEMP/glass-cut-release.apk" \
            "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/glass-cut-release.apk"

          cp "$RUNNER_TEMP/glass-cut-release.apk" glass-cut-release.apk

          rm -f "$RUNNER_TEMP/keystore.jks" "$RUNNER_TEMP/aligned.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: glass-cut-release-apk
          path: glass-cut-release.apk
          if-no-files-found: error
          retention-days: 30
